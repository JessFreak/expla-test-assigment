<div class="app-layout" [class.chat-active]="!!selectedUserId()">
    @if (socketService.error(); as error) {
        <div class="error-banner">
            <span>{{ error }}</span>
            <button type="button" (click)="socketService.clearError()">&times;</button>
        </div>
    }

    <app-chat-sidebar
            [previews]="socketService.chatPreviews()"
            [selectedUserId]="selectedUserId()"
            (selectUser)="onSelectUser($event)"
            (filterChange)="onFilterChange($event)"
    ></app-chat-sidebar>

    <main class="chat-main">
        @if (selectedUserId()) {
            <app-chat-window
                    [activeContact]="activeContact()"
                    [currentUserId]="userService.currentUser()?.id || null"
                    [currentUserAvatar]="userService.currentUser()?.avatar || null"
                    [messages]="socketService.messages()"
                    (sendMessage)="onSendMessage($event)"
                    (goBack)="onBack()"
            ></app-chat-window>
        } @else {
            <div class="empty-chat-placeholder">
                Select a chat to start messaging
            </div>
        }
    </main>
</div>
